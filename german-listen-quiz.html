<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>德文聽力練習選擇題</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #e8f1ff 0%, #f7faff 35%, #f0f4fb 100%);
      color: #1f2937;
    }
    .page-shell {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 20px 36px;
    }
    .hero {
      background: linear-gradient(135deg, #3f72af 0%, #112d4e 100%);
      border-radius: 28px;
      color: #fff;
      padding: 32px 28px;
      box-shadow: 0 18px 50px rgba(17, 45, 78, 0.18);
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -30px;
      right: -60px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(255,255,255,0.16);
    }
    .hero h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 2.75vw, 3rem);
      line-height: 1.05;
    }
    .hero p {
      max-width: 680px;
      margin: 0;
      font-size: 1.05rem;
      opacity: 0.92;
      line-height: 1.75;
    }
    .card {
      background: #ffffff;
      border-radius: 28px;
      padding: 28px;
      margin-top: -26px;
      box-shadow: 0 20px 60px rgba(15, 39, 79, 0.08);
      backdrop-filter: blur(8px);
    }
    .controls {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    button {
      border: none;
      border-radius: 14px;
      padding: 14px 20px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #4b8ceb 0%, #2d6cd8 100%);
      transition: transform .15s ease, filter .15s ease, box-shadow .15s ease;
      box-shadow: 0 10px 24px rgba(75, 140, 235, 0.18);
    }
    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }
    .options {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }
    .option-btn {
      background: #f4f8ff;
      color: #17233d;
      text-align: left;
      padding: 16px 18px;
      border-radius: 18px;
      border: 1px solid transparent;
      box-shadow: inset 0 0 0 1px rgba(81, 116, 206, 0.12);
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
    }
    .option-btn:hover {
      background: #e6efff;
      transform: translateY(-1px);
      border-color: #93b0f7;
    }
    .result {
      margin-top: 20px;
      font-size: 1rem;
      min-height: 1.2em;
      font-weight: 600;
    }
    .result.correct { color: #0f7b3b; }
    .result.wrong { color: #be1e2d; }
    .progress {
      margin-top: 10px;
      font-size: .95rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <section class="hero">
      <h1>德文聽力練習</h1>
      <p>用簡單日常句子練習德語聽力，按「播放句子」聽德文，再從中文選項中選出正確意思。每次打開題目順序會隨機打亂，不容易重複。</p>
    </section>
    <div class="card">
      <div class="controls">
        <button id="playBtn">播放句子</button>
        <button id="nextBtn">下一題</button>
      </div>
      <div class="progress" id="progress"></div>
      <div class="options" id="options"></div>
      <div class="result" id="result"></div>
    </div>
  </div>

  <script>
    const questions = [
      { text: 'Guten Morgen! Wie geht es dir heute am Morgen?', choices: ['你今天早上過得如何？', '你要去哪裡？', '我喜歡這件衣服。'], answer: 0 },
      { text: 'Ich brauche ein großes Glas Wasser, bitte, weil mir sehr durstig ist.', choices: ['請給我一大杯水，因為我很渴。', '這個多少錢？', '我有一隻貓。'], answer: 0 },
      { text: 'Wo ist die nächste U-Bahn-Station, die in Richtung Stadtzentrum fährt?', choices: ['最近開往市中心的地鐵站在哪裡？', '你喜歡吃什麼？', '明天要不要見面？'], answer: 0 },
      { text: 'Kannst du mir helfen, diesen Weg zum Hotel zu finden?', choices: ['你可以幫我找到到飯店的路嗎？', '你想喝茶還是咖啡？', '我的手機不見了。'], answer: 0 },
      { text: 'Ich habe heute Abend Zeit, wenn du dich treffen möchtest.', choices: ['我今晚有時間，如果你想見面。', '我不想出門。', '我住在台北。'], answer: 0 },
      { text: 'Das Essen schmeckt sehr gut, besonders die Suppe ist sehr lecker.', choices: ['這餐很好吃，特別是湯很美味。', '這件衣服很便宜。', '我明天很忙。'], answer: 0 },
      { text: 'Bitte gib mir deinen Namen und deine Telefonnummer.', choices: ['請告訴我你的名字和電話。', '你要幾點出發？', '我已經吃飽了。'], answer: 0 },
      { text: 'Ich fahre mit dem Fahrrad zur Arbeit, weil es schnell und gesund ist.', choices: ['我騎腳踏車上班，因為又快又健康。', '我今天要去購物。', '我有一個弟弟。'], answer: 0 },
      { text: 'Heute ist das Wetter sehr schön, also wollen wir im Park spazieren gehen.', choices: ['今天天氣很好，我們去公園散步吧。', '我正在寫一封信。', '你會說中文嗎？'], answer: 0 },
      { text: 'Entschuldigung, ich habe eine Frage zum Busfahrplan für morgen.', choices: ['不好意思，我有一個關於明天公車時刻的問題。', '請問廁所在哪裡？', '你喜歡看電影嗎？'], answer: 0 }
    ];

    let questionOrder = [];
    let currentIndex = 0;
    let answered = false;

    const playBtn = document.getElementById('playBtn');
    const nextBtn = document.getElementById('nextBtn');
    const optionsContainer = document.getElementById('options');
    const resultEl = document.getElementById('result');
    const progressEl = document.getElementById('progress');

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function startQuiz() {
      questionOrder = questions.slice();
      shuffleArray(questionOrder);
      currentIndex = 0;
      loadQuestion();
    }

    function updateProgress() {
      progressEl.textContent = `題目 ${currentIndex + 1} / ${questionOrder.length}`;
    }

    function loadQuestion() {
      const question = questionOrder[currentIndex];
      optionsContainer.innerHTML = '';
      resultEl.textContent = '';
      answered = false;

      question.choices.forEach((choice, index) => {
        const button = document.createElement('button');
        button.className = 'option-btn';
        button.textContent = choice;
        button.addEventListener('click', () => selectAnswer(index));
        optionsContainer.appendChild(button);
      });
      updateProgress();
    }

    function selectAnswer(choiceIndex) {
      if (answered) return;
      answered = true;
      const question = questionOrder[currentIndex];
      if (choiceIndex === question.answer) {
        resultEl.textContent = '答對了！✅';
        resultEl.className = 'result correct';
      } else {
        resultEl.textContent = `答錯了。正確答案是：「${question.choices[question.answer]}」。`;
        resultEl.className = 'result wrong';
      }
    }

    function speakSentence() {
      const question = questionOrder[currentIndex];
      if (!('speechSynthesis' in window)) {
        alert('此瀏覽器不支援語音合成，請使用 Chrome 或 Edge。');
        return;
      }
      const utterance = new SpeechSynthesisUtterance(question.text);
      utterance.lang = 'de-DE';
      speechSynthesis.cancel();
      speechSynthesis.speak(utterance);
    }

    playBtn.addEventListener('click', speakSentence);
    nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % questionOrder.length;
      loadQuestion();
    });

    startQuiz();
  </script>
</body>
</html>
