<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>德文聽力練習選擇題</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #e8f1ff 0%, #f7faff 35%, #f0f4fb 100%);
      color: #1f2937;
    }
    .page-shell {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 20px 36px;
    }
    .hero {
      background: linear-gradient(135deg, #3f72af 0%, #112d4e 100%);
      border-radius: 28px;
      color: #fff;
      padding: 32px 28px;
      box-shadow: 0 18px 50px rgba(17, 45, 78, 0.18);
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -30px;
      right: -60px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(255,255,255,0.16);
    }
    .hero h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 2.75vw, 3rem);
      line-height: 1.05;
    }
    .hero p {
      max-width: 680px;
      margin: 0;
      font-size: 1.05rem;
      opacity: 0.92;
      line-height: 1.75;
    }
    .card {
      background: #ffffff;
      border-radius: 28px;
      padding: 28px;
      margin-top: -26px;
      box-shadow: 0 20px 60px rgba(15, 39, 79, 0.08);
      backdrop-filter: blur(8px);
    }
    .controls {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    button {
      border: none;
      border-radius: 14px;
      padding: 14px 20px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #4b8ceb 0%, #2d6cd8 100%);
      transition: transform .15s ease, filter .15s ease, box-shadow .15s ease;
      box-shadow: 0 10px 24px rgba(75, 140, 235, 0.18);
    }
    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }
    .options {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }
    .option-btn {
      background: #f4f8ff;
      color: #17233d;
      text-align: left;
      padding: 16px 18px;
      border-radius: 18px;
      border: 1px solid transparent;
      box-shadow: inset 0 0 0 1px rgba(81, 116, 206, 0.12);
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      min-height: 72px;
      display: flex;
      align-items: center;
      white-space: normal;
    }
    .option-btn:hover {
      background: #e6efff;
      transform: translateY(-1px);
      border-color: #93b0f7;
    }
    .result {
      margin-top: 20px;
      font-size: 1rem;
      min-height: 1.2em;
      font-weight: 600;
    }
    .result.correct { color: #0f7b3b; }
    .result.wrong { color: #be1e2d; }
    .progress {
      margin-top: 10px;
      font-size: .95rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <section class="hero">
      <h1>德文聽力練習</h1>
      <p>用簡單日常句子練習德語聽力，按「播放句子」聽德文，再從中文選項中選出正確意思。每次打開題目順序會隨機打亂，不容易重複。</p>
    </section>
    <div class="card">
      <div class="controls">
        <button id="playBtn">播放句子</button>
        <button id="nextBtn">下一題</button>
      </div>
      <div class="progress" id="progress"></div>
      <div class="options" id="options"></div>
      <div class="result" id="result"></div>
    </div>
  </div>

  <script>
    const questions = [
      { text: 'Guten Morgen! Wie geht es dir heute am Morgen, nachdem du so früh aufgestanden bist?', choices: ['你今天早上過得如何？', '你今天晚上有空嗎？', '你喜歡這件衣服嗎？'], answer: 0 },
      { text: 'Ich brauche ein großes Glas Wasser, bitte, weil ich sehr durstig bin und es draußen heiß ist.', choices: ['請給我一大杯水，因為我很渴而且外面很熱。', '這個多少錢？', '我有一隻貓。'], answer: 0 },
      { text: 'Wo ist die nächste U-Bahn-Station, die in Richtung Stadtzentrum fährt und nicht zu weit entfernt ist?', choices: ['最近開往市中心、而且不太遠的地鐵站在哪裡？', '你喜歡吃什麼？', '明天要不要見面？'], answer: 0 },
      { text: 'Kannst du mir helfen, diesen Weg zum Hotel zu finden, weil ich mich hier nicht gut auskenne?', choices: ['你可以幫我找到到飯店的路嗎？我對這裡不是很熟。', '你想喝茶還是咖啡？', '我的手機不見了。'], answer: 0 },
      { text: 'Ich habe heute Abend Zeit, wenn du dich treffen möchtest, aber ich kann nicht zu spät bleiben.', choices: ['我今晚有時間，如果你想見面，但我不能待太晚。', '我不想出門。', '我住在台北。'], answer: 0 },
      { text: 'Das Essen schmeckt sehr gut, besonders die Suppe und das Brot, das frisch gebacken wurde.', choices: ['這餐很好吃，特別是湯和剛烤好的麵包。', '這件衣服很便宜。', '我明天很忙。'], answer: 0 },
      { text: 'Bitte gib mir deinen Namen und deine Telefonnummer, falls wir uns später noch einmal treffen möchten.', choices: ['請告訴我你的名字和電話，萬一天氣好我們再見面。', '你要幾點出發？', '我已經吃飽了。'], answer: 0 },
      { text: 'Ich fahre mit dem Fahrrad zur Arbeit, weil es schnell und gesund ist und ich die frische Luft mag.', choices: ['我騎腳踏車上班，因為又快又健康，而且我喜歡新鮮空氣。', '我今天要去購物。', '我有一個弟弟。'], answer: 0 },
      { text: 'Heute ist das Wetter sehr schön, also wollen wir im Park spazieren gehen und vielleicht ein Eis essen.', choices: ['今天天氣很好，我們去公園散步，或許還可以吃冰淇淋。', '我正在寫一封信。', '你會說中文嗎？'], answer: 0 },
      { text: 'Entschuldigung, ich habe eine Frage zum Busfahrplan für morgen, weil ich früh am Flughafen sein muss.', choices: ['不好意思，我有一個關於明天公車時刻的問題，因為我必須很早到機場。', '請問廁所在哪裡？', '你喜歡看電影嗎？'], answer: 0 }
    ];

    let questionPool = [];
    let currentQuestion = null;
    let currentIndex = 0;
    let answered = false;
    let lives = 3;

    const playBtn = document.getElementById('playBtn');
    const nextBtn = document.getElementById('nextBtn');
    const optionsContainer = document.getElementById('options');
    const resultEl = document.getElementById('result');
    const progressEl = document.getElementById('progress');

    // Audio context for sound effects
    let audioContext;
    function initAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === 'suspended') {
        audioContext.resume().catch(() => {});
      }
    }

    function playSound(frequency, duration, type = 'sine') {
      initAudio();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      oscillator.frequency.value = frequency;
      oscillator.type = type;

      gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);

      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + duration);
    }

    function playCorrectSound() {
      playSound(523.25, 0.3); // C5
      setTimeout(() => playSound(659.25, 0.3), 100); // E5
      setTimeout(() => playSound(783.99, 0.5), 200); // G5
    }

    function playWrongSound() {
      playSound(220, 0.5, 'sawtooth'); // A3
    }

    function playClickSound() {
      playSound(800, 0.1);
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startQuiz() {
      questionPool = shuffleArray(questions.slice());
      currentIndex = 0;
      lives = 3;
      updateLivesDisplay();
      loadNextQuestion();
    }

    function updateProgress() {
      progressEl.textContent = `題目 ${currentIndex} / ${questions.length} | 生命: ${lives}`;
    }

    function updateLivesDisplay() {
      updateProgress();
    }

    function loadNextQuestion() {
      if (questionPool.length === 0) {
        questionPool = shuffleArray(questions.slice());
        currentIndex = 0;
      }

      currentQuestion = questionPool.pop();
      currentIndex += 1;
      optionsContainer.innerHTML = '';
      resultEl.textContent = '';
      answered = false;

      // Shuffle choices and track correct answer
      const shuffledChoices = shuffleArray(currentQuestion.choices.slice());
      const correctIndex = shuffledChoices.indexOf(currentQuestion.choices[currentQuestion.answer]);

      shuffledChoices.forEach((choice, index) => {
        const button = document.createElement('button');
        button.className = 'option-btn';
        button.textContent = choice;
        button.addEventListener('click', () => {
          playClickSound();
          selectAnswer(index === correctIndex);
        });
        optionsContainer.appendChild(button);
      });
      updateProgress();
    }

    function selectAnswer(isCorrect) {
      if (answered) return;
      answered = true;

      if (isCorrect) {
        resultEl.textContent = '答對了！✅';
        resultEl.className = 'result correct';
        playCorrectSound();
      } else {
        resultEl.textContent = `答錯了。正確答案是：「${currentQuestion.choices[currentQuestion.answer]}」。`;
        resultEl.className = 'result wrong';
        playWrongSound();
        lives--;
        updateLivesDisplay();

        if (lives <= 0) {
          setTimeout(() => {
            alert('生命用完了！重新開始遊戲。');
            startQuiz();
          }, 2000);
          return;
        }
      }
    }

    function speakSentence() {
      if (!('speechSynthesis' in window)) {
        alert('此瀏覽器不支援語音合成，請使用 Chrome 或 Edge。');
        return;
      }
      const utterance = new SpeechSynthesisUtterance(currentQuestion.text);
      utterance.lang = 'de-DE';
      speechSynthesis.cancel();
      speechSynthesis.speak(utterance);
    }

    playBtn.addEventListener('click', () => {
      playClickSound();
      speakSentence();
    });
    nextBtn.addEventListener('click', () => {
      playClickSound();
      loadNextQuestion();
    });

    startQuiz();
  </script>
</body>
</html>
