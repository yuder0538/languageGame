<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>德文聽力練習選擇題</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      background-attachment: fixed;
      color: #1f2937;
    }
    .page-shell {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 20px 36px;
      animation: fadeInDown 0.6s ease;
    }
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .hero {
      background: linear-gradient(135deg, #3f72af 0%, #112d4e 100%);
      border-radius: 28px;
      color: #fff;
      padding: 32px 28px;
      box-shadow: 0 25px 50px rgba(17, 45, 78, 0.3);
      position: relative;
      overflow: hidden;
      animation: heroGlow 3s ease-in-out infinite;
    }
    @keyframes heroGlow {
      0%, 100% { box-shadow: 0 25px 50px rgba(17, 45, 78, 0.3); }
      50% { box-shadow: 0 30px 60px rgba(17, 45, 78, 0.5); }
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -30px;
      right: -60px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(255,255,255,0.16);
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
    }
    .hero h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 2.75vw, 3rem);
      line-height: 1.05;
      animation: slideInLeft 0.8s ease 0.2s both;
    }
    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    .hero p {
      max-width: 680px;
      margin: 0;
      font-size: 1.05rem;
      opacity: 0.92;
      line-height: 1.75;
      animation: slideInLeft 0.8s ease 0.4s both;
    }
    .card {
      background: #ffffff;
      border-radius: 28px;
      padding: 28px;
      margin-top: -26px;
      box-shadow: 0 20px 60px rgba(15, 39, 79, 0.15);
      backdrop-filter: blur(8px);
      animation: scaleUp 0.6s ease 0.3s both;
    }
    @keyframes scaleUp {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    .controls {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    button {
      border: none;
      border-radius: 14px;
      padding: 14px 20px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #4b8ceb 0%, #2d6cd8 100%);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 10px 24px rgba(75, 140, 235, 0.25);
      position: relative;
      overflow: hidden;
    }
    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.2);
      transition: left 0.5s ease;
    }
    button:hover::before {
      left: 100%;
    }
    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(75, 140, 235, 0.4);
    }
    button:active {
      transform: translateY(-1px) scale(0.98);
    }
    .options {
      display: grid;
      gap: 14px;
      margin-top: 18px;
      grid-auto-rows: minmax(72px, auto);
    }
    .option-btn {
      background: linear-gradient(135deg, #f4f8ff 0%, #e8f2ff 100%);
      color: #17233d;
      text-align: left;
      padding: 16px 18px;
      border-radius: 18px;
      border: 2px solid transparent;
      box-shadow: 0 4px 12px rgba(81, 116, 206, 0.1);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      min-height: 72px;
      display: flex;
      align-items: center;
      white-space: normal;
      line-height: 1.5;
      font-weight: 500;
    }
    .option-btn:hover {
      background: linear-gradient(135deg, #e6efff 0%, #d9e8ff 100%);
      transform: translateX(6px);
      border-color: #93b0f7;
      box-shadow: 0 8px 20px rgba(81, 116, 206, 0.2);
    }
    .option-btn:active {
      transform: translateX(4px) scale(0.98);
    }
    .result {
      margin-top: 20px;
      font-size: 1.1rem;
      min-height: 1.5em;
      font-weight: 700;
      animation: slideInUp 0.5s ease;
    }
    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .result.correct {
      color: #0f7b3b;
      text-shadow: 0 0 10px rgba(15, 123, 59, 0.2);
    }
    .result.wrong {
      color: #be1e2d;
      text-shadow: 0 0 10px rgba(190, 30, 45, 0.2);
    }
    .progress {
      margin-top: 10px;
      font-size: 0.95rem;
      color: #64748b;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <section class="hero">
      <h1>德文聽力練習</h1>
      <p>用簡單日常句子練習德語聽力，按「播放句子」聽德文，再從中文選項中選出正確意思。每次打開題目順序會隨機打亂，不容易重複。</p>
    </section>
    <div class="card">
      <div class="controls">
        <button id="playBtn">播放句子</button>
        <button id="nextBtn">下一題</button>
      </div>
      <div class="progress" id="progress"></div>
      <div class="options" id="options"></div>
      <div class="result" id="result"></div>
    </div>
  </div>

  <script>
    const questions = [
      { text: 'Guten Morgen! Wie geht es dir heute am Morgen, nachdem du so früh aufgestanden bist?', choices: ['你今天早上過得如何？', '你昨天晚上睡得好嗎？我想知道你休息好了沒。', '你今天準備要去哪裡？我們可以一起走。'], answer: 0 },
      { text: 'Ich brauche ein großes Glas Wasser, bitte, weil ich sehr durstig bin und es draußen heiß ist.', choices: ['請給我一大杯水，因為我很渴而且外面很熱。', '你有沒有別的飲料可以推薦給我？', '我想先坐下來休息再喝東西。'], answer: 0 },
      { text: 'Wo ist die nächste U-Bahn-Station, die in Richtung Stadtzentrum fährt und nicht zu weit entfernt ist?', choices: ['最近開往市中心、而且不太遠的地鐵站在哪裡？', '你知道附近哪裡有比較好吃的餐廳嗎？', '這裡離旅館還有多遠，我該怎麼走？'], answer: 0 },
      { text: 'Kannst du mir helfen, diesen Weg zum Hotel zu finden, weil ich mich hier nicht gut auskenne?', choices: ['你可以幫我找到到飯店的路嗎？我對這裡不是很熟。', '我想先查一下地圖再決定要不要走這條路。', '你能不能先告訴我最近的地標是什麼？'], answer: 0 },
      { text: 'Ich habe heute Abend Zeit, wenn du dich treffen möchtest, aber ich kann nicht zu spät bleiben.', choices: ['我今晚有時間，如果你想見面，但我不能待太晚。', '我今天下午還有很多事，所以晚一點再說。', '如果太晚了，我明天一早還要去上班。'], answer: 0 },
      { text: 'Das Essen schmeckt sehr gut, besonders die Suppe und das Brot, das frisch gebacken wurde.', choices: ['這餐很好吃，特別是湯和剛烤好的麵包。', '這家餐廳的氣氛也很舒服，我覺得很適合聚餐。', '我覺得甜點的味道也滿有特色的。'], answer: 0 },
      { text: 'Bitte gib mir deinen Namen und deine Telefonnummer, falls wir uns später noch einmal treffen möchten.', choices: ['請告訴我你的名字和電話，萬一天氣好我們再見面。', '你覺得我們什麼時候再約比較方便？', '如果你方便的話，我想記下你的聯絡方式。'], answer: 0 },
      { text: 'Ich fahre mit dem Fahrrad zur Arbeit, weil es schnell und gesund ist und ich die frische Luft mag.', choices: ['我騎腳踏車上班，因為又快又健康，而且我喜歡新鮮空氣。', '我每天騎車上班可以避開公車的擁擠。', '天氣好時騎車上班感覺特別輕鬆。'], answer: 0 },
      { text: 'Heute ist das Wetter sehr schön, also wollen wir im Park spazieren gehen und vielleicht ein Eis essen.', choices: ['今天天氣很好，我們去公園散步，或許還可以吃冰淇淋。', '你覺得公園裡的花開得怎麼樣？', '我們走到湖邊坐著聊聊天好不好？'], answer: 0 },
      { text: 'Entschuldigung, ich habe eine Frage zum Busfahrplan für morgen, weil ich früh am Flughafen sein muss.', choices: ['不好意思，我有一個關於明天公車時刻的問題，因為我必須很早到機場。', '你知道哪一班車比較快可以到機場嗎？', '我不確定什麼時間出門才不會趕不上。'], answer: 0 }
    ];

    let questionPool = [];
    let currentQuestion = null;
    let currentIndex = 0;
    let answered = false;
    let lives = 3;

    const playBtn = document.getElementById('playBtn');
    const nextBtn = document.getElementById('nextBtn');
    const optionsContainer = document.getElementById('options');
    const resultEl = document.getElementById('result');
    const progressEl = document.getElementById('progress');

    // Audio context for sound effects
    let audioContext;
    async function initAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === 'suspended') {
        await audioContext.resume().catch(() => {});
      }
    }

    async function playSound(frequency, duration, type = 'sine') {
      await initAudio();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      oscillator.frequency.value = frequency;
      oscillator.type = type;

      gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);

      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + duration);
    }

    function playCorrectSound() {
      playSound(523.25, 0.3); // C5
      setTimeout(() => playSound(659.25, 0.3), 100); // E5
      setTimeout(() => playSound(783.99, 0.5), 200); // G5
    }

    function playWrongSound() {
      playSound(220, 0.5, 'sawtooth'); // A3
    }

    function playClickSound() {
      playSound(800, 0.1).catch(() => {});
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startQuiz() {
      questionPool = shuffleArray(questions.slice());
      currentIndex = 0;
      lives = 3;
      updateLivesDisplay();
      loadNextQuestion();
    }

    function updateProgress() {
      progressEl.textContent = `題目 ${currentIndex} / ${questions.length} | 生命: ${lives}`;
    }

    function updateLivesDisplay() {
      updateProgress();
    }

    function loadNextQuestion() {
      if (questionPool.length === 0) {
        questionPool = shuffleArray(questions.slice());
        currentIndex = 0;
      }

      currentQuestion = questionPool.pop();
      currentIndex += 1;
      optionsContainer.innerHTML = '';
      resultEl.textContent = '';
      answered = false;

      // Shuffle choices and track correct answer
      const shuffledChoices = shuffleArray(currentQuestion.choices.slice());
      const correctIndex = shuffledChoices.indexOf(currentQuestion.choices[currentQuestion.answer]);

      shuffledChoices.forEach((choice, index) => {
        const button = document.createElement('button');
        button.className = 'option-btn';
        button.textContent = choice;
        button.addEventListener('click', () => {
          playClickSound();
          selectAnswer(index === correctIndex);
        });
        optionsContainer.appendChild(button);
      });
      updateProgress();
    }

    function selectAnswer(isCorrect) {
      if (answered) return;
      answered = true;

      if (isCorrect) {
        resultEl.textContent = '答對了！✅';
        resultEl.className = 'result correct';
        playCorrectSound();
      } else {
        resultEl.textContent = `答錯了。正確答案是：「${currentQuestion.choices[currentQuestion.answer]}」。`;
        resultEl.className = 'result wrong';
        playWrongSound();
        lives--;
        updateLivesDisplay();

        if (lives <= 0) {
          setTimeout(() => {
            alert('生命用完了！重新開始遊戲。');
            startQuiz();
          }, 2000);
          return;
        }
      }
    }

    function speakSentence() {
      if (!('speechSynthesis' in window)) {
        alert('此瀏覽器不支援語音合成，請使用 Chrome 或 Edge。');
        return;
      }
      const voices = speechSynthesis.getVoices();
      if (!voices.length) {
        speechSynthesis.onvoiceschanged = () => {
          speakSentence();
        };
        return;
      }
      const utterance = new SpeechSynthesisUtterance(currentQuestion.text);
      utterance.lang = 'de-DE';
      utterance.volume = 1;
      utterance.rate = 0.95;
      speechSynthesis.cancel();
      speechSynthesis.speak(utterance);
    }

    playBtn.addEventListener('click', () => {
      playClickSound();
      speakSentence();
    });
    nextBtn.addEventListener('click', () => {
      playClickSound();
      loadNextQuestion();
    });

    startQuiz();
  </script>
</body>
</html>
