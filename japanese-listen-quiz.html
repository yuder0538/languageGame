<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日文聽力練習選擇題</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #c77dff 0%, #e0aaff 100%);
      background-attachment: fixed;
      color: #1f2937;
    }
    .page-shell {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 20px 36px;
      animation: fadeInDown 0.6s ease;
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .hero {
      background: linear-gradient(135deg, #9c5de5 0%, #5a189a 100%);
      border-radius: 28px;
      color: #fff;
      padding: 32px 28px;
      box-shadow: 0 25px 50px rgba(150, 30, 180, 0.3);
      position: relative;
      overflow: hidden;
      animation: heroGlow 3s ease-in-out infinite;
    }
    @keyframes heroGlow {
      0%, 100% { box-shadow: 0 25px 50px rgba(150, 30, 180, 0.3); }
      50% { box-shadow: 0 30px 60px rgba(150, 30, 180, 0.5); }
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -28px;
      right: -52px;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: rgba(255,255,255,0.14);
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
    }
    .hero h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 2.75vw, 3rem);
      line-height: 1.05;
      animation: slideInLeft 0.8s ease 0.2s both;
    }
    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-30px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .hero p {
      max-width: 720px;
      margin: 0;
      font-size: 1.05rem;
      opacity: 0.92;
      line-height: 1.75;
      animation: slideInLeft 0.8s ease 0.4s both;
    }
    .card {
      background: #ffffff;
      border-radius: 28px;
      padding: 28px;
      margin-top: -26px;
      box-shadow: 0 20px 60px rgba(92, 25, 154, 0.15);
      backdrop-filter: blur(8px);
      animation: scaleUp 0.6s ease 0.3s both;
    }
    @keyframes scaleUp {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .controls {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    button {
      border: none;
      border-radius: 14px;
      padding: 14px 20px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #9c5de5 0%, #6a4c93 100%);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 10px 24px rgba(156, 93, 229, 0.25);
      position: relative;
      overflow: hidden;
    }
    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.2);
      transition: left 0.5s ease;
    }
    button:hover::before {
      left: 100%;
    }
    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(156, 93, 229, 0.4);
    }
    button:active {
      transform: translateY(-1px) scale(0.98);
    }
    .options {
      display: grid;
      gap: 14px;
      margin-top: 18px;
      grid-auto-rows: minmax(72px, auto);
    }
    .option-btn {
      background: linear-gradient(135deg, #f8f3ff 0%, #f0e6ff 100%);
      color: #1f2340;
      text-align: left;
      padding: 16px 18px;
      border-radius: 18px;
      border: 2px solid transparent;
      box-shadow: 0 4px 12px rgba(156, 93, 229, 0.1);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      min-height: 72px;
      display: flex;
      align-items: center;
      white-space: normal;
      line-height: 1.5;
      font-weight: 500;
    }
    .option-btn:hover {
      background: linear-gradient(135deg, #eee5ff 0%, #e6d9ff 100%);
      transform: translateX(6px);
      border-color: #c7b3ee;
      box-shadow: 0 8px 20px rgba(156, 93, 229, 0.2);
    }
    .option-btn:active {
      transform: translateX(4px) scale(0.98);
    }
    .result {
      margin-top: 20px;
      font-size: 1.1rem;
      min-height: 1.5em;
      font-weight: 700;
      animation: slideInUp 0.5s ease;
    }
    @keyframes slideInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .result.correct {
      color: #0f7b3b;
      text-shadow: 0 0 10px rgba(15, 123, 59, 0.2);
    }
    .result.wrong {
      color: #be1e2d;
      text-shadow: 0 0 10px rgba(190, 30, 45, 0.2);
    }
    .progress {
      margin-top: 10px;
      font-size: 0.95rem;
      color: #64748b;
      font-weight: 500;
    }
    a.back-link {
      display: inline-block;
      margin-top: 22px;
      color: #5a189a;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    a.back-link:hover {
      transform: translateX(-4px);
      color: #9c5de5;
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <section class="hero">
      <h1>日文聽力練習</h1>
      <p>使用生活化日常句子練習聽力。按「播放句子」先聽日文，再從中文選項中選出正確意思。每次打開題目順序會隨機打亂，增加挑戰性。</p>
    </section>
    <div class="card">
      <div class="controls">
        <button id="playBtn">播放句子</button>
        <button id="nextBtn">下一題</button>
      </div>
      <div class="progress" id="progress"></div>
      <div class="options" id="options"></div>
      <div class="result" id="result"></div>
      <a class="back-link" href="index.html">← 回到語言選單</a>
    </div>
  </div>

  <script src="questions_output.js"></script>
  <script>
    const questions = japaneseQuestions;

    const QUESTIONS_PER_ROUND = 20;
    let questionPool = [];
    let currentQuestion = null;
    let currentIndex = 0;
    let correctCount = 0;
    let answered = false;
    let lives = 3;
    let totalQuestions = QUESTIONS_PER_ROUND;

    const playBtn = document.getElementById('playBtn');
    const nextBtn = document.getElementById('nextBtn');
    const optionsContainer = document.getElementById('options');
    const resultEl = document.getElementById('result');
    const progressEl = document.getElementById('progress');

    // Audio context for sound effects
    let audioContext;
    async function initAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === 'suspended') {
        await audioContext.resume().catch(() => {});
      }
    }

    async function playSound(frequency, duration, type = 'sine') {
      await initAudio();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      oscillator.frequency.value = frequency;
      oscillator.type = type;

      gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);

      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + duration);
    }

    function playCorrectSound() {
      playSound(523.25, 0.3); // C5
      setTimeout(() => playSound(659.25, 0.3), 100); // E5
      setTimeout(() => playSound(783.99, 0.5), 200); // G5
    }

    function playWrongSound() {
      playSound(220, 0.5, 'sawtooth'); // A3
    }

    function playClickSound() {
      playSound(800, 0.1).catch(() => {});
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function selectRandomQuestions(arr, count) {
      const shuffled = shuffleArray(arr.slice());
      return shuffled.slice(0, count);
    }

    function startQuiz() {
      questionPool = selectRandomQuestions(questions, QUESTIONS_PER_ROUND);
      currentIndex = 0;
      correctCount = 0;
      lives = 3;
      answered = false;
      updateLivesDisplay();
      loadNextQuestion();
    }

    function updateProgress() {
      progressEl.textContent = `題目 ${currentIndex} / ${totalQuestions} | 生命: ${lives} | 正確: ${correctCount}`;
    }

    function updateLivesDisplay() {
      updateProgress();
    }

    function showGameComplete() {
      optionsContainer.innerHTML = '';
      resultEl.innerHTML = `
        <div style="text-align: center; padding: 40px 20px; font-size: 1.2rem;">
          <div style="margin-bottom: 20px; font-size: 2rem;">🎉 遊戲完成！🎉</div>
          <div style="margin-bottom: 30px; font-size: 1.5rem;">最終分數：${correctCount} / ${totalQuestions}</div>
          <button id="restartBtn" style="padding: 16px 32px; font-size: 1.1rem; margin-top: 20px;">重新開始</button>
        </div>
      `;
      resultEl.className = 'result';
      progressEl.textContent = '';
      playBtn.disabled = true;
      nextBtn.disabled = true;
      document.getElementById('restartBtn').addEventListener('click', () => {
        playClickSound();
        playBtn.disabled = false;
        nextBtn.disabled = false;
        startQuiz();
      });
    }

    function loadNextQuestion() {
      if (questionPool.length === 0) {
        showGameComplete();
        return;
      }

      currentQuestion = questionPool.pop();
      currentIndex += 1;
      optionsContainer.innerHTML = '';
      resultEl.textContent = '';
      answered = false;

      // Shuffle choices and track correct answer
      const shuffledChoices = shuffleArray(currentQuestion.choices.slice());
      const correctIndex = shuffledChoices.indexOf(currentQuestion.choices[currentQuestion.answer]);

      shuffledChoices.forEach((choice, index) => {
        const button = document.createElement('button');
        button.className = 'option-btn';
        button.textContent = choice;
        button.addEventListener('click', () => {
          playClickSound();
          selectAnswer(index === correctIndex);
        });
        optionsContainer.appendChild(button);
      });
      updateProgress();
    }

    function selectAnswer(isCorrect) {
      if (answered) return;
      answered = true;

      if (isCorrect) {
        resultEl.textContent = '答對了！✅';
        resultEl.className = 'result correct';
        playCorrectSound();
        correctCount++;
      } else {
        resultEl.textContent = `答錯了。正確答案是：「${currentQuestion.choices[currentQuestion.answer]}」。`;
        resultEl.className = 'result wrong';
        playWrongSound();
        lives--;
        updateLivesDisplay();

        if (lives <= 0) {
          setTimeout(() => {
            showGameComplete();
          }, 2000);
          return;
        }
      }
    }

    function speakSentence() {
      if (!('speechSynthesis' in window)) {
        alert('此瀏覽器不支援語音合成，請使用 Chrome 或 Edge。');
        return;
      }
      const voices = speechSynthesis.getVoices();
      if (!voices.length) {
        speechSynthesis.onvoiceschanged = () => {
          speakSentence();
        };
        return;
      }
      const utterance = new SpeechSynthesisUtterance(currentQuestion.text);
      utterance.lang = 'ja-JP';
      utterance.volume = 1;
      utterance.rate = 0.95;
      speechSynthesis.cancel();
      speechSynthesis.speak(utterance);
    }

    playBtn.addEventListener('click', () => {
      playClickSound();
      speakSentence();
    });
    nextBtn.addEventListener('click', () => {
      playClickSound();
      loadNextQuestion();
    });

    startQuiz();
  </script>
</body>
</html>
